
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#103b36">
<title>EULLIYAN’S | Masjid Prayer Board</title>

<style>
:root {
  --green: #103b36;
  --dark: #082b28;
  --cyan: #00b7c3;
  --white: #ffffff;
  --mint: #e4f3f0;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: var(--white);
  color: var(--green);
  font-family: Arial, sans-serif;
  padding: 12px;
}

.page {
  width: 100%;
  max-width: 1100px;
  margin: auto;
}

header {
  text-align: center;
  padding: 8px 5px 14px;
}

.brand {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 3px;
  color: var(--green);
}

.brand-sub {
  color: #66817c;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 4px;
}

h1 {
  font-size: clamp(21px, 4vw, 34px);
  margin-top: 13px;
  letter-spacing: 1px;
}

.mosque-sub {
  font-size: 12px;
  color: #6c8580;
  margin-top: 5px;
}

.clock-box,
.next-box,
.prayer-card {
  background: linear-gradient(145deg, var(--green), var(--dark));
  color: var(--white);
  border: 1px solid rgba(0,183,195,.5);
  border-radius: 18px;
  box-shadow: 0 5px 15px rgba(8,43,40,.12);
}

.clock-box {
  text-align: center;
  padding: 17px 10px;
  margin-bottom: 12px;
}

.clock {
  font-size: clamp(35px, 9vw, 65px);
  font-weight: 800;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
}

.date {
  color: #c9e5df;
  font-size: 13px;
  margin-top: 6px;
}

.next-box {
  text-align: center;
  padding: 15px 10px;
  margin-bottom: 14px;
}

.section-label {
  font-size: 11px;
  color: #a9dcd7;
  letter-spacing: 2px;
  font-weight: bold;
}

.next-name {
  font-size: 25px;
  font-weight: 800;
  margin: 7px 0;
}

.countdown {
  color: var(--cyan);
  font-size: clamp(29px, 7vw, 42px);
  font-weight: 900;
  letter-spacing: 3px;
  font-variant-numeric: tabular-nums;
}

.prayer-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 9px;
}

.prayer-card {
  text-align: center;
  padding: 13px 4px;
  min-width: 0;
}

.prayer-icon {
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: var(--white);
  color: var(--green);
  display: grid;
  place-items: center;
  margin: 0 auto 9px;
  font-size: 17px;
}

.prayer-name {
  font-size: clamp(10px, 2vw, 14px);
  font-weight: 700;
  margin-bottom: 7px;
}

.prayer-time {
  color: var(--cyan);
  font-size: clamp(12px, 2.4vw, 18px);
  font-weight: 900;
  white-space: nowrap;
}

.prayer-card.active {
  border: 2px solid var(--cyan);
  box-shadow: 0 0 12px rgba(0,183,195,.25);
}

.notice {
  text-align: center;
  background: var(--mint);
  border: 1px solid #c5e4de;
  color: #456b64;
  border-radius: 12px;
  padding: 9px;
  font-size: 11px;
  margin-top: 14px;
}

footer {
  text-align: center;
  padding: 13px 5px 5px;
  color: #66817c;
  font-size: 11px;
  line-height: 1.7;
}

footer strong {
  color: var(--green);
  letter-spacing: 2px;
}

.language {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin: 0 0 12px;
}

.language button {
  border: 1px solid #b8d8d2;
  background: var(--white);
  color: var(--green);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
}

.language button.selected {
  background: var(--green);
  color: var(--white);
  border-color: var(--green);
}

@media (max-width: 430px) {
  body {
    padding: 8px;
  }

  header {
    padding-bottom: 10px;
  }

  .clock-box {
    padding: 13px 8px;
  }

  .next-box {
    padding: 12px 8px;
  }

  .prayer-grid {
    gap: 5px;
  }

  .prayer-card {
    padding: 11px 2px;
    border-radius: 13px;
  }

  .prayer-icon {
    width: 29px;
    height: 29px;
    font-size: 14px;
    margin-bottom: 7px;
  }

  .notice {
    margin-top: 11px;
  }

  footer {
    padding-top: 10px;
  }
}

@media (min-width: 700px) {
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .page {
    padding: 15px 25px;
  }

  .clock-box {
    padding: 22px;
  }

  .next-box {
    padding: 20px;
  }

  .prayer-card {
    padding: 20px 8px;
  }
}
</style>
</head>

<body>
<main class="page">

<header>
  <div class="brand">EULLIYAN’S</div>
  <div class="brand-sub">DIGITAL MOSQUE SOLUTIONS</div>
  <h1 id="heading">🕌 MASJID PRAYER BOARD</h1>
  <p class="mosque-sub" id="mosqueSub">Your Mosque • Your City</p>
</header>

<nav class="language" aria-label="Language">
  <button class="selected" onclick="setLanguage('en')">EN</button>
  <button onclick="setLanguage('bn')">বাংলা</button>
  <button onclick="setLanguage('ar')">العربية</button>
</nav>

<section class="clock-box">
  <div class="clock" id="clock">00:00:00</div>
  <div class="date" id="date">Loading date...</div>
</section>

<section class="next-box">
  <div class="section-label" id="nextLabel">NEXT PRAYER</div>
  <div class="next-name" id="nextName">Fajr</div>
  <div class="countdown" id="countdown">00:00:00</div>
</section>

<section class="prayer-grid" id="prayerGrid"></section>

<div class="notice" id="notice">
  Demo prayer times — configure your local mosque timings before public use.
</div>

<footer>
  <strong>EULLIYAN’S</strong><br>
  Digital Mosque Prayer Board<br>
  Designed for a peaceful prayer experience
</footer>

</main>

<script>
const prayerTimes = [
  { key: "fajr", time: "05:00", icon: "🌙" },
  { key: "dhuhr", time: "12:15", icon: "☀️" },
  { key: "asr", time: "15:30", icon: "🌤️" },
  { key: "maghrib", time: "17:45", icon: "🌇" },
  { key: "isha", time: "19:15", icon: "🌃" }
];

const translations = {
  en: {
    heading: "🕌 MASJID PRAYER BOARD",
    mosque: "Your Mosque • Your City",
    next: "NEXT PRAYER",
    notice: "Demo prayer times — configure your local mosque timings before public use.",
    prayers: {
      fajr: "Fajr",
      dhuhr: "Dhuhr",
      asr: "Asr",
      maghrib: "Maghrib",
      isha: "Isha"
    }
  },
  bn: {
    heading: "🕌 মসজিদের নামাজ বোর্ড",
    mosque: "আপনার মসজিদ • আপনার শহর",
    next: "পরবর্তী নামাজ",
    notice: "ডেমো নামাজের সময় — ব্যবহারের আগে স্থানীয় মসজিদের সময় সেট করুন।",
    prayers: {
      fajr: "ফজর",
      dhuhr: "যোহর",
      asr: "আসর",
      maghrib: "মাগরিব",
      isha: "এশা"
    }
  },
  ar: {
    heading: "🕌 مواقيت الصلاة",
    mosque: "مسجدك • مدينتك",
    next: "الصلاة القادمة",
    notice: "أوقات تجريبية — يرجى ضبط مواقيت المسجد المحلي قبل الاستخدام.",
    prayers: {
      fajr: "الفجر",
      dhuhr: "الظهر",
      asr: "العصر",
      maghrib: "المغرب",
      isha: "العشاء"
    }
  }
};

let currentLanguage = "en";

function setLanguage(language) {
  currentLanguage = language;

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  const t = translations[language];

  document.getElementById("heading").textContent = t.heading;
  document.getElementById("mosqueSub").textContent = t.mosque;
  document.getElementById("nextLabel").textContent = t.next;
  document.getElementById("notice").textContent = t.notice;

  document.querySelectorAll(".language button").forEach(button => {
    button.classList.toggle(
      "selected",
      button.textContent.trim() ===
        (language === "en" ? "EN" : language === "bn" ? "বাংলা" : "العربية")
    );
  });

  renderPrayers();
  updateClock();
}

function renderPrayers(nextKey = "") {
  const names = translations[currentLanguage].prayers;

  document.getElementById("prayerGrid").innerHTML =
    prayerTimes.map(prayer => `
      <article class="prayer-card ${prayer.key === nextKey ? "active" : ""}">
        <div class="prayer-icon">${prayer.icon}</div>
        <div class="prayer-name">${names[prayer.key]}</div>
        <div class="prayer-time">${formatTime(prayer.time)}</div>
      </article>
    `).join("");
}

function formatTime(time) {
  const [hour, minute] = time.split(":").map(Number);
  const suffix = hour >= 12 ? "PM" : "AM";
  const displayHour = hour % 12 || 12;

  if (currentLanguage === "bn") {
    return `${displayHour}:${String(minute).padStart(2, "0")} ${suffix === "AM" ? "পূর্বাহ্ণ" : "অপরাহ্ণ"}`;
  }

  if (currentLanguage === "ar") {
    return `${displayHour}:${String(minute).padStart(2, "0")} ${suffix === "AM" ? "ص" : "م"}`;
  }

  return `${displayHour}:${String(minute).padStart(2, "0")} ${suffix}`;
}

function updateClock() {
  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString(
      currentLanguage === "bn" ? "bn-BD" :
      currentLanguage === "ar" ? "ar-SA" : "en-US",
      { hour12: true }
    );

  document.getElementById("date").textContent =
    now.toLocaleDateString(
      currentLanguage === "bn" ? "bn-BD" :
      currentLanguage === "ar" ? "ar-SA" : "en-US",
      { weekday: "long", year: "numeric", month: "long", day: "numeric" }
    );

  updateNextPrayer(now);
}

function updateNextPrayer(now) {
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  let next = prayerTimes.find(prayer => {
    const [hour, minute] = prayer.time.split(":").map(Number);
    return hour * 60 + minute > currentMinutes;
  });

  const target = new Date(now);

  if (!next) {
    next = prayerTimes[0];
    target.setDate(target.getDate() + 1);
  }

  const [hour, minute] = next.time.split(":").map(Number);
  target.setHours(hour, minute, 0, 0);

  const remaining = Math.max(0, Math.floor((target - now) / 1000));

  const hh = Math.floor(remaining / 3600);
  const mm = Math.floor((remaining % 3600) / 60);
  const ss = remaining % 60;

  document.getElementById("countdown").textContent =
    [hh, mm, ss]
      .map(value => String(value).padStart(2, "0"))
      .join(":");

  document.getElementById("nextName").textContent =
    translations[currentLanguage].prayers[next.key];

  renderPrayers(next.key);
}

renderPrayers();
updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
